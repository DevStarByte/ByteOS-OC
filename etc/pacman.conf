#
# /etc/pacman.conf - ByteOS package manager configuration
#
[options]
HoldPkg     = pacman bytekernel
Architecture = lua54
CheckSpace
ParallelDownloads = 1
SigLevel    = Never

# Repositories. A "Server" is either an http(s):// URL (needs an internet
# card) or a path on a mounted disk. Extra disks are mounted at
# /mnt/<first 8 chars of the disk address>, e.g. for an offline floppy:
#   Server = /mnt/1a2b3c4d/repo/core

[core]
Server = https://raw.githubusercontent.com/DevStarByte/ByteOS-OC/packages/core

[extra]
Server = https://raw.githubusercontent.com/DevStarByte/ByteOS-OC/packages/extra

#[community]
#Server = /mnt/1a2b3c4d/repo/community
