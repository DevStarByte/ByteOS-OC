# /etc/hypr/hyprpaper.conf - copy to ~/.config/hypr/hyprpaper.conf to change it;
# hyprpaper notices a change within two seconds.

# a text file drawn in the middle (try /usr/share/hyprpaper/*.txt), or none
wallpaper = /usr/share/hyprpaper/byteos.txt
# what fills the rest: dots, grid, stars, waves or none
pattern = dots
# colours: theme names (accent, blue, cyan, magenta, dim, muted, ...)
color = accent
pattern_color = raised
